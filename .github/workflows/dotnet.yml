name: CyberGuard Build & Release

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Build & Package
    runs-on: windows-latest

    steps:
      # 1 — Check out the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2 — Set up MSBuild (comes with Visual Studio on windows-latest)
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # 3 — Restore NuGet packages (safe to run even if there are none)
      - name: Restore NuGet packages
        run: nuget restore CyberGuard.sln

      # 4 — Build Release configuration
      - name: Build solution (Release)
        run: msbuild CyberGuard.sln /p:Configuration=Release /p:Platform="Any CPU" /t:Build /v:minimal

      # 5 — Run a quick smoke-test: confirm the .exe was produced
      - name: Verify build output
        run: |
          if (Test-Path "bin\Release\CyberGuard.exe") {
            Write-Host "✅ CyberGuard.exe found — build succeeded."
          } else {
            Write-Error "❌ CyberGuard.exe not found — build failed."
            exit 1
          }
        shell: pwsh

      # 6 — Upload the Release folder as a downloadable artifact
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberGuard-Release
          path: bin\Release\
          retention-days: 30
